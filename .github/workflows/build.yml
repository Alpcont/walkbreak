name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $BT/aapt2 dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          $BT/aapt2 dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk | grep -iE "testOnly|sdkVersion|debuggable" || true

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/WalkBreak.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WalkBreak-APK
          path: app/build/outputs/apk/debug/WalkBreak.apk

      # Publish as a GitHub Release so this fixed link always downloads the newest APK:
      # https://github.com/Alpcont/walkbreak/releases/latest/download/WalkBreak.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release create "v$VER-build${{ github.run_number }}" \
            app/build/outputs/apk/debug/WalkBreak.apk \
            --title "WalkBreak $VER (build ${{ github.run_number }})" \
            --notes "Tap WalkBreak.apk below to download and install." \
            --latest
